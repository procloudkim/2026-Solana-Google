<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Mandate Pool rejection-path proof</title>
  <desc id="description">A receipt-backed summary showing that Buyer B's 300000 atomic-unit cap is below the required 333333 share, so the approved order ends in NO_BUY without settlement evidence or entitlements.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1322"/>
      <stop offset="1" stop-color="#171225"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff6f91"/>
      <stop offset="1" stop-color="#b78cff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1110" cy="75" r="155" fill="#8d5cff" opacity="0.08"/>
  <circle cx="75" cy="650" r="200" fill="#ff547d" opacity="0.06"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="46" width="148" height="32" rx="16" fill="#ff6f91" opacity="0.14" stroke="#ff87a2" stroke-opacity="0.55"/>
    <text x="138" y="67" fill="#ffacc0" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.4">REJECT PATH</text>
    <text x="64" y="124" fill="#ffffff" font-size="42" font-weight="760">NO_BUY before settlement</text>
    <text x="64" y="158" fill="#aebbd0" font-size="18">Three people approved their own mandates. One hard budget constraint still stopped the purchase.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="197" width="320" height="132" rx="18" fill="#111e31" stroke="#30405a"/>
      <rect x="408" y="197" width="320" height="132" rx="18" fill="#111e31" stroke="#30405a"/>
      <rect x="752" y="197" width="384" height="132" rx="18" fill="#211627" stroke="#704052"/>
    </g>
    <text x="88" y="229" fill="#90a1bc" font-size="14" font-weight="650" letter-spacing="0.8">BUYER B MAXIMUM</text>
    <text x="88" y="279" fill="#ffffff" font-size="36" font-weight="760">300000</text>
    <text x="88" y="306" fill="#91a5c1" font-size="14">atomic units · approved by B</text>

    <text x="432" y="229" fill="#90a1bc" font-size="14" font-weight="650" letter-spacing="0.8">REQUIRED B SHARE</text>
    <text x="432" y="279" fill="#ffffff" font-size="36" font-weight="760">333333</text>
    <text x="432" y="306" fill="#91a5c1" font-size="14">atomic units · canonical split</text>

    <text x="776" y="229" fill="#ffacc0" font-size="14" font-weight="700" letter-spacing="0.8">POLICY RESULT</text>
    <text x="776" y="278" fill="url(#accent)" font-size="36" font-weight="800">300000 &lt; 333333</text>
    <text x="776" y="306" fill="#efb7c5" font-size="14">NO_COMMON_PRODUCT · state NO_BUY</text>

    <rect x="64" y="359" width="1072" height="132" rx="18" fill="#0d192a" stroke="#2b3b54"/>
    <text x="88" y="391" fill="#90a1bc" font-size="13" font-weight="700" letter-spacing="1.1">OBSERVED WORKFLOW</text>
    <g font-size="17" font-weight="650">
      <text x="88" y="439" fill="#ffffff">Natural-language mandates</text>
      <text x="303" y="439" fill="#657792">→</text>
      <text x="343" y="439" fill="#ffffff">A/B/C HITL approved</text>
      <text x="536" y="439" fill="#657792">→</text>
      <text x="576" y="439" fill="#ffffff">Gemini selected NO_BUY</text>
      <text x="800" y="439" fill="#657792">→</text>
      <text x="840" y="439" fill="#ffacc0">0 entitlements</text>
    </g>
    <text x="88" y="469" fill="#aebbd0" font-size="15">Receipt contains no settlement evidence or transaction signature. The payment path was never entered.</text>

    <rect x="64" y="521" width="1072" height="86" rx="16" fill="#151c2b" stroke="#303e55"/>
    <text x="88" y="551" fill="#8799b4" font-size="12" font-weight="700" letter-spacing="0.9">ORDER RECEIPT</text>
    <text x="88" y="580" fill="#edf3ff" font-family="SFMono-Regular, Consolas, monospace" font-size="16">ord_82ac0530d4744e098f181aa5460e6027</text>
    <text x="1110" y="555" fill="#aebbd0" font-size="14" text-anchor="end">Google ADK · gemini-2.5-flash</text>
    <text x="1110" y="581" fill="#8293ae" font-size="13" text-anchor="end">submission/evidence/reject-order-2ac7eac.json</text>

    <text x="64" y="643" fill="#7586a2" font-size="13">Scope: application receipt evidence. No Devnet transaction is claimed for this rejected order.</text>
    <text x="1136" y="643" fill="#ff9db4" font-size="13" font-weight="700" text-anchor="end">MANDATE POOL</text>
  </g>
</svg>
