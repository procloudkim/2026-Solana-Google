<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">Mandate Pool finalized Solana Devnet proof</title>
  <desc id="description">A receipt-backed summary of one finalized Solana Devnet test-USDC transaction: Buyer A paid 333334 atomic units, Buyers B and C paid 333333 each, and the merchant received 1000000.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071724"/>
      <stop offset="1" stop-color="#071c1b"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45e5b2"/>
      <stop offset="1" stop-color="#58b8ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1200" height="675" rx="28" fill="url(#background)"/>
  <circle cx="1100" cy="68" r="170" fill="#42e6b0" opacity="0.07"/>
  <circle cx="60" cy="660" r="210" fill="#38a8ff" opacity="0.06"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <rect x="64" y="46" width="192" height="32" rx="16" fill="#42e6b0" opacity="0.13" stroke="#5aefbd" stroke-opacity="0.55"/>
    <text x="160" y="67" fill="#82f2cd" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.3">SOLANA DEVNET</text>
    <text x="64" y="124" fill="#ffffff" font-size="42" font-weight="760">1.000000 test USDC · finalized</text>
    <text x="64" y="158" fill="#a8bbc9" font-size="18">One approved order, one transaction signature, three exact debits, three entitlements.</text>

    <g filter="url(#shadow)">
      <rect x="64" y="195" width="1072" height="104" rx="18" fill="#0d2330" stroke="#2b4e5d"/>
    </g>
    <text x="88" y="226" fill="#87a6b5" font-size="13" font-weight="700" letter-spacing="1.0">CANONICAL ATOMIC SPLIT</text>
    <g font-size="23" font-weight="760">
      <text x="88" y="269" fill="#ffffff">A 333334</text>
      <text x="224" y="269" fill="#5e8190">+</text>
      <text x="258" y="269" fill="#ffffff">B 333333</text>
      <text x="394" y="269" fill="#5e8190">+</text>
      <text x="428" y="269" fill="#ffffff">C 333333</text>
      <text x="564" y="269" fill="#5e8190">=</text>
      <text x="600" y="269" fill="url(#success)">Merchant +1000000</text>
    </g>
    <text x="1110" y="268" fill="#87a6b5" font-size="14" text-anchor="end">6 decimals</text>

    <rect x="64" y="327" width="524" height="178" rx="18" fill="#0c202d" stroke="#284655"/>
    <text x="88" y="359" fill="#87a6b5" font-size="13" font-weight="700" letter-spacing="1.0">FINALIZED TRANSACTION</text>
    <text x="88" y="397" fill="#ffffff" font-size="19" font-weight="700">commitment</text>
    <text x="556" y="397" fill="#76efc7" font-size="19" font-weight="750" text-anchor="end">finalized</text>
    <text x="88" y="433" fill="#ffffff" font-size="19" font-weight="700">slot</text>
    <text x="556" y="433" fill="#d7e5ed" font-size="19" font-weight="650" text-anchor="end">480936920</text>
    <text x="88" y="469" fill="#ffffff" font-size="19" font-weight="700">meta.err · transfers · signers</text>
    <text x="556" y="469" fill="#d7e5ed" font-size="19" font-weight="650" text-anchor="end">null · 3 · 4</text>

    <rect x="612" y="327" width="524" height="178" rx="18" fill="#0c202d" stroke="#284655"/>
    <text x="636" y="359" fill="#87a6b5" font-size="13" font-weight="700" letter-spacing="1.0">FINALIZED TOKEN BALANCES</text>
    <text x="636" y="397" fill="#ffffff" font-size="17" font-weight="650">Buyer A</text>
    <text x="1110" y="397" fill="#c8d9e2" font-family="SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="end">20000000 → 19666666</text>
    <text x="636" y="430" fill="#ffffff" font-size="17" font-weight="650">Buyer B / C</text>
    <text x="1110" y="430" fill="#c8d9e2" font-family="SFMono-Regular, Consolas, monospace" font-size="16" text-anchor="end">20000000 → 19666667 each</text>
    <text x="636" y="463" fill="#ffffff" font-size="17" font-weight="650">Merchant</text>
    <text x="1110" y="463" fill="#76efc7" font-family="SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700" text-anchor="end">0 → 1000000</text>
    <text x="1110" y="489" fill="#8ba2b0" font-size="13" text-anchor="end">post-normal snapshot · finalized slot 480937002</text>

    <rect x="64" y="529" width="1072" height="88" rx="16" fill="#101f29" stroke="#294654"/>
    <text x="88" y="557" fill="#87a6b5" font-size="12" font-weight="700" letter-spacing="0.9">TRANSACTION SIGNATURE</text>
    <text x="88" y="586" fill="#edf8fc" font-family="SFMono-Regular, Consolas, monospace" font-size="15">2JMWb2wc4GTtD2XYsfD3T9F5UdQHkV7k5n88Mno9RDnBd5q7MKKyyziyRSoeQ28woWgvodqsckfuwDt2jaMy2ZAW</text>
    <text x="1110" y="557" fill="#76efc7" font-size="14" font-weight="750" text-anchor="end">FULFILLED · 3 entitlements</text>

    <text x="64" y="648" fill="#758d9b" font-size="12">Sources: normal-order-2ac7eac.json · devnet-balance-post-normal-2ac7eac.json</text>
    <text x="1136" y="648" fill="#75e9c3" font-size="12" font-weight="700" text-anchor="end">DEVNET TEST TOKEN · NOT REAL MONEY</text>
  </g>
</svg>
